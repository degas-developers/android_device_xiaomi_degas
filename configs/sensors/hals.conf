# Sub-HALs loaded by android.hardware.sensors-service.xiaomi-multihal.
#
# Ours rather than the extracted blob because of the last entry: degas has no
# hardware sensor that reports an in-display-fingerprint press (the MediaTek SCP
# advertises xiaomi.sensor.fod, but touch runs in Xiaomi's userspace THP mode, so
# the SCP never sees a finger), and config_dozeUdfpsLongPressSensorType needs one
# to make fingerprint unlock work in AOD. See sensors/UdfpsSensorSubHal.cpp.
android.hardware.sensors@2.X-subhal-mediatek.so
sensors.touch.detect.so
sensors.dynamic_sensor_hal.so
sensors.udfps.degas.so
